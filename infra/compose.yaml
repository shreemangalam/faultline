services:
  postgres:
    image: postgres:16-alpine
    container_name: faultline-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-faultline}
      POSTGRES_USER: ${POSTGRES_USER:-faultline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: [postgres-data:/var/lib/postgresql/data]

  survey:
    build:
      context: ..
      dockerfile: survey/Dockerfile
    environment:
      SURVEY_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-faultline}
      POSTGRES_USER: ${POSTGRES_USER:-faultline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8081:8081"]

  restore:
    build:
      context: ..
      dockerfile: restore/Dockerfile
    environment:
      RESTORE_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-faultline}
      POSTGRES_USER: ${POSTGRES_USER:-faultline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      RESTORE_WORKER_ENABLED: ${RESTORE_WORKER_ENABLED:-false}
      RESTORE_WORKER_ID: ${RESTORE_WORKER_ID:-restore-compose-worker}
      RESTORE_WORKER_BATCH_SIZE: ${RESTORE_WORKER_BATCH_SIZE:-5}
      RESTORE_WORKER_LEASE_SECONDS: ${RESTORE_WORKER_LEASE_SECONDS:-60}
      RESTORE_WORKER_FIXED_DELAY: ${RESTORE_WORKER_FIXED_DELAY:-1s}
      RESTORE_WORKER_INITIAL_DELAY: ${RESTORE_WORKER_INITIAL_DELAY:-1s}
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8082:8082"]
  dashboard:
    build:
      context: ..
      dockerfile: dashboard/Dockerfile
      args:
        SURVEY_API_URL: http://survey:8081
    environment:
      SURVEY_API_URL: http://survey:8081
    depends_on: [survey]
    ports: ["3000:3000"]

volumes:
  postgres-data: