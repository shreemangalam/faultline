spring:
  application:
    name: faultline-restore
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${RESTORE_DB_URL:jdbc:postgresql://localhost:5432/faultline}
    username: ${POSTGRES_USER:faultline}
    password: ${POSTGRES_PASSWORD:change-me-locally}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc.batch_size: 500
        order_inserts: true
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    table: restore_flyway_schema_history
    baseline-on-migrate: true
    baseline-version: 0
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8082}

faultline:
  security:
    enabled: ${FAULTLINE_SECURITY_ENABLED:true}
    api-key: ${FAULTLINE_API_KEY:local-development-only}

restore:
  operations-demo:
    enabled: ${RESTORE_OPERATIONS_DEMO_ENABLED:false}
  worker:
    enabled: ${RESTORE_WORKER_ENABLED:false}
    id: ${RESTORE_WORKER_ID:restore-worker}
    batch-size: ${RESTORE_WORKER_BATCH_SIZE:5}
    lease-seconds: ${RESTORE_WORKER_LEASE_SECONDS:60}
    fixed-delay: ${RESTORE_WORKER_FIXED_DELAY:1s}
    initial-delay: ${RESTORE_WORKER_INITIAL_DELAY:1s}
  retry:
    jitter-window: ${RESTORE_RETRY_JITTER_WINDOW:2s}
  stream:
    timeout: ${RESTORE_STREAM_TIMEOUT:30m}
    heartbeat-interval: ${RESTORE_STREAM_HEARTBEAT_INTERVAL:15s}
    notification-buffer-capacity: ${RESTORE_STREAM_NOTIFICATION_BUFFER_CAPACITY:256}
  downstream:
    base-url: ${RESTORE_DOWNSTREAM_BASE_URL:}
    api-key: ${RESTORE_DOWNSTREAM_API_KEY:}
    connect-timeout: ${RESTORE_DOWNSTREAM_CONNECT_TIMEOUT:1s}
    read-timeout: ${RESTORE_DOWNSTREAM_READ_TIMEOUT:2s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
