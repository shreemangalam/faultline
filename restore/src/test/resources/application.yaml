spring:
  datasource:
    url: jdbc:h2:mem:faultline-restore;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    table: restore_flyway_schema_history
    baseline-on-migrate: true
    baseline-version: 0